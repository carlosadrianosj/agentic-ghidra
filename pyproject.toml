[project]
name = "pyghidra-mcp"
version = "1.0.0"
description = "Python Command-Line Ghidra MCP"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "anyio>=4.5",
    "click>=8.2.1",
    "click-option-group>=0.5.9",
    "mcp[cli]>=1.26.0,<2",
    "pyghidra>=2.2.1",
    "chromadb>=1.3.5",
    "ghidrecomp>=0.5.8",
    "jsonschema>=4.23",
]
authors = [
    { name = "clearbluejar", email = "3752074+clearbluejar@users.noreply.github.com" },
    { name = "notoriousrip", email = "3935212+unimpossible@users.noreply.github.com" },
]
keywords = [
    "security",
    "dynamic-analysis",
    "static-analysis",
    "pyghidra",
    "ghidra",
    "mcp",
    "reverse-engineering"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "aiohttp",
    "pytest-cov>=6.2.1",
    "ghidra-stubs>=11.3.2",
    "pytest-cov>=6.2.1",
    "mcp[cli]>=1.26.0,<2",
    "ruff>=0.11.4",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "pyright>=1.1.0",
    "uv>=0.8.11",
]


[project.optional-dependencies]
dev = [
    "pytest>=8.4.1",
    "pytest-asyncio>=0.23.0",
    "aiohttp",
    "pytest-cov>=6.2.1",
    "ghidra-stubs>=11.3.2",
    "pytest-cov>=6.2.1",
    "mcp[cli]>=1.26.0,<2",
    "ruff>=0.11.4",
    "tomli>=2.0.1",
    "tomli-w>=1.0.0",
    "pyright>=1.1.0",
    "uv>=0.8.11",
]

[project.scripts]
pyghidra-mcp = "pyghidra_mcp.server:main"
agentic-ghidra = "pyghidra_mcp.supervisor:main"

[tool.hatch.build]
include = [
    "src/pyghidra_mcp",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.hatch.build.targets.wheel]
packages = [
    "src/pyghidra_mcp",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = [
    "build",
    "dist",
]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "B",
    "I",
    "UP",
    "N",
    "W",
    "C90",
    "RUF",
]
ignore = ["F821", "E402"]
# this is because of Java / Python import issues (see Jpype)
# top of file must be ignored as well

[tool.ruff.lint.per-file-ignores]
# JPype Java-interface stubs must keep their camelCase method names.
"tests/unit/test_advanced_runtime.py" = ["N802"]
# tests/acceptance holds standalone, rerunnable acceptance drivers against a
# live supervisor; linear scripts and long JSON literals are accepted there.
"tests/acceptance/**" = ["E501", "C901", "RUF059", "RUF100", "B007", "B905", "UP031", "F841"]
# gen_llms_doc embeds bilingual prose (fullwidth punctuation) and long JSON
# examples on purpose.
"tools/gen_llms_doc.py" = ["E501", "RUF001", "RUF002", "RUF003"]


[tool.ruff.lint.isort]
known-first-party = ["pyghidra_mcp"]
known-third-party = ["ghidra", "ghidrecomp", "java", "jpype"]

combine-as-imports = true
split-on-trailing-comma = true

[tool.ruff.lint.mccabe]
max-complexity = 10

[tool.pytest.ini_options]
# Acceptance suites under tests/acceptance are standalone scripts against a
# live supervisor; the automated pytest run covers unit and integration only.
testpaths = ["tests/unit", "tests/integration"]

[tool.pyright]
reportMissingModuleSource = false
