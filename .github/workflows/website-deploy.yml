# Deploy the documentation website on every main update.
#
# Checks out the private agentic-ghidra-website repository, syncs docs/llm.txt
# and docs/llm-zh.txt into it (current version served at the site root), commits
# when they change and deploys the site to Vercel production.

name: Website Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

env:
  VERCEL_ORG_ID: team_9krHYYcDAnKBN8AfC4isCCX7
  VERCEL_PROJECT_ID: prj_UfPSeYJDej8pAXrCNA7C2JzBwKJT

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout website repository
        uses: actions/checkout@v4
        with:
          repository: carlosadrianosj/agentic-ghidra-website
          token: ${{ secrets.WEBSITE_REPO_TOKEN }}
          path: site

      - name: Checkout documentation
        uses: actions/checkout@v4
        with:
          sparse-checkout: docs
          path: docs-repo

      - name: Sync LLM reference files
        run: |
          cp docs-repo/docs/llm.txt site/website/llm.txt
          cp docs-repo/docs/llm-zh.txt site/website/llm-zh.txt

      - name: Commit synced files
        working-directory: site
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add website/llm.txt website/llm-zh.txt
          git diff --cached --quiet || git commit -m "Sync LLM reference from agentic-ghidra ${GITHUB_SHA}"
          git push

      - name: Deploy to Vercel
        run: |
          npm install --global vercel@latest
          cd site
          vercel deploy --prod --yes --token "$VERCEL_TOKEN"
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
